[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "airguard"
version = "1.0.0"
description = "Wireless defense & monitoring suite — WIDS sensor, deauth/evil-twin/rogue-AP detection, beacon anomalies, spectrum analysis, WPA3 survey, RF health"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com"},
]
keywords = ["wireless", "wids", "802.11", "security", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
airguard = "airguard.cli:main"

[project.optional-dependencies]
dev = ["pyyaml"]

[tool.setuptools.packages.find]
include = ["airguard*"]

[tool.setuptools.package-data]
airguard = ["fixtures/**/*.bin", "fixtures/**/*.json"]
airguard.fixtures = ["**/*.bin", "**/*.json"]
